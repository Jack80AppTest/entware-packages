name: Build transmission-old 4.1.x split ARMv7

on:
  workflow_dispatch:
  push:
    branches:
      - transmission-old-4.1.3-split

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout package repository
        uses: actions/checkout@v6

      - name: Checkout Entware buildroot
        uses: actions/checkout@v6
        with:
          repository: Entware/Entware
          ref: 969c703e6fd8b2ad84d82affaeb14b48d1fcb105
          path: entware

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex gawk gcc-multilib gettext git \
            libncurses5-dev libssl-dev python2 python-is-python3 \
            python3-distutils subversion unzip zlib1g-dev rsync

      - name: Prepare GCC 14 target configuration
        working-directory: entware
        run: |
          cp configs/armv7-3.2.config .config
          sed -i 's/^CONFIG_GCC_USE_VERSION_8=y$/# CONFIG_GCC_USE_VERSION_8 is not set/' .config
          sed -i 's/^# CONFIG_GCC_USE_VERSION_14 is not set$/CONFIG_GCC_USE_VERSION_14=y/' .config
          sh "$GITHUB_WORKSPACE/transmission-old/build/prepare-entware-gcc14.sh" .
          make defconfig
          grep -E 'CONFIG_GCC_USE_VERSION_(8|14)|CONFIG_GCC_VERSION=|CONFIG_GLIBC_VERSION=|CONFIG_TARGET_ARCH_PACKAGES=' .config

      - name: Restore GCC 14 build cache
        id: restore-cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: |
            entware/bin
            entware/build_dir
            entware/staging_dir
          key: transmission-armv7-gcc14-entware-969c703e-v1

      - name: Build tools and GCC 14 toolchain
        if: steps.restore-cache.outputs.cache-hit != 'true'
        working-directory: entware
        run: |
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          make target/compile -j$(nproc)

      - name: Save GCC 14 build cache
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            entware/bin
            entware/build_dir
            entware/staging_dir
          key: transmission-armv7-gcc14-entware-969c703e-v1

      - name: Add split package repository as feed
        working-directory: entware
        run: |
          echo "src-git jacklul https://github.com/${GITHUB_REPOSITORY}.git;${GITHUB_REF_NAME}" >> feeds.conf
          make package/symlinks
          grep -R "PKG_VERSION:=4.1.3" -n package/feeds/jacklul/transmission-old/Makefile

      - name: Select all five split packages
        working-directory: entware
        run: |
          for pkg in runtime daemon cli remote web; do
            echo "CONFIG_PACKAGE_transmission-old-${pkg}=m" >> .config
          done
          make defconfig
          grep -E '^CONFIG_PACKAGE_transmission-old-(runtime|daemon|cli|remote|web)=m$' .config

      - name: Build split transmission-old packages
        working-directory: entware
        run: |
          make package/feeds/jacklul/transmission-old/clean
          make package/feeds/jacklul/transmission-old/compile -j1 V=sc

      - name: Collect exactly five IPKs
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p artifacts
          packages=(runtime daemon cli remote web)
          for pkg in "${packages[@]}"; do
            matches=(entware/bin/targets/*/*/packages/transmission-old-${pkg}_4.1.3-*.ipk)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one IPK for transmission-old-${pkg}, found ${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi
            cp -v "${matches[0]}" artifacts/
          done
          count="$(find artifacts -maxdepth 1 -type f -name 'transmission-old-*_4.1.3-*.ipk' | wc -l)"
          [ "$count" -eq 5 ]
          sha256sum artifacts/*.ipk

      - name: Exhaustive five-package validation
        run: |
          set -euo pipefail
          bash transmission-old/build/validate-ipk.sh artifacts | tee artifacts/validation-report.txt

      - name: Upload ARMv7 split IPKs and validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transmission-old-4.1.3-split-armv7sf-k3.2
          path: |
            artifacts/*.ipk
            artifacts/validation-report.txt
